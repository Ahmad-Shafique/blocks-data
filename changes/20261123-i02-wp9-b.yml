summary: IStorageService gains UploadPublicObjectAsync(container, key, stream, contentType) and OpenReadAsync(container, key). Azure sets the container access level to Blob, S3 and S3-compatible stores get a bucket policy on that one bucket (anonymous s3:GetObject only), and SFTP throws NotSupportedException. Reached through the file service and the driver in the next change.
